version: v1alpha5
clusters:
  - name: test-cluster
    stage: test
    type: hub
    dnsName: test.titlis.dev
    ssoOrg: wl
    ssoTeam: team
    ingressClassName: traefik
    terraform:
      provider: none
      projectId: tc
      kubernetesType: <edge, ske or cce>
      kubernetesVersion: "1.36"
      dns:
        name: test.titlis.dev
        email: my-test@nowhere.com
    argocd:
      selfManaged: enabled
      repo:
        authMode: https
        git:
          configs:
            url: https://github.com/titlis-cloud/kubara-demo.git
            targetRevision: main
          components:
            url: https://github.com/titlis-cloud/kubara-demo.git
            targetRevision: main
    catalogs:
      - oci://ghcr.io/kubara-io/catalogs/general:7.0.0
    services:
      cert-manager:
        status: enabled
        config:
          clusterIssuer:
            email: yourname@your-domain.de
            name: letsencrypt-staging
            server: https://acme-staging-v02.api.letsencrypt.org/directory
      crossplane:
        status: disabled
      external-dns:
        status: enabled
      external-secrets:
        status: enabled
      homer-dashboard:
        status: enabled
      kube-prometheus-stack:
        status: enabled
      kyverno:
        status: enabled
      kyverno-policies:
        status: enabled
      kyverno-policy-reporter:
        status: enabled
      loki:
        status: enabled
      longhorn:
        status: disabled
      metallb:
        status: disabled
      metrics-server:
        status: disabled
      oauth2-proxy:
        status: enabled
      reloader:
        status: disabled
      traefik:
        status: enabled
      velero:
        status: disabled
        config:
          backupMode: fs-backup
          backupStorage:
            create: true
            region: eu01
